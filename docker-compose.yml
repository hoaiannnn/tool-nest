services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: toolnest-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "Vietnamese_CI_AI"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: